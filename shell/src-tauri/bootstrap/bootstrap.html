<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-supervisor — 环境引导</title>
<style>
  /* ============================================================
   * dsh-supervisor 引导页（健壮版）
   * 职责单一：检测环境 -> 桌面版本 -> 内核版本 -> 服务就绪 -> 进入面板。更新为强制，不得绕开。
   * 关键原则：每步真实成败；失败可重试、可诊断；**绝不假成功**。
   * ============================================================ */
  :root {
    --brand: #2F54EB; --brand-soft: rgb(47 84 235 / 12%);
    --text: #0F1115; --status: #6b747d; --line: #DDE3EC; --ok: #10b981; --err: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --brand: #6b83ff; --brand-soft: rgb(107 131 255 / 18%);
      --text: #f1f4f9; --status: #9aa3ad; --line: #262b36; --ok: #34d399; --err: #ff6369; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; height: 100dvh; }
  body { margin: 0; background: transparent; color: var(--text); overflow: hidden;
    font-family: Inter, "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { width: 100%; height: 100%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 38%, var(--brand-soft), transparent 32%), #FAFBFC; }
  @media (prefers-color-scheme: dark) {
    .page { background: radial-gradient(circle at 50% 38%, rgb(107 131 255 / 14%), transparent 32%), #0f1115; }
  }
  .inner { display: grid; justify-items: center; gap: 20px; width: min(520px, calc(100% - 48px)); }
  .startup-logo { position: relative; display: grid; width: 72px; height: 72px; place-items: center;
    border: 1px solid rgb(47 84 235 / 14%); border-radius: 999px;
    background: linear-gradient(145deg, rgb(255 255 255 / 96%), rgb(239 245 242 / 92%));
    box-shadow: 0 18px 42px rgb(15 23 42 / 10%), inset 0 1px 0 rgb(255 255 255 / 90%); color: var(--brand); }
  .startup-logo::after { position: absolute; inset: -8px; content: ""; border-radius: 999px;
    border: 2px solid rgb(47 84 235 / 10%); border-top-color: var(--brand); animation: spin 960ms linear infinite; }
  .startup-logo.done::after { animation: none; border-color: rgb(16 185 129 / 30%); border-top-color: var(--ok); }
  .startup-logo-image { width: 46px; height: 46px; background: currentColor;
    mask: url("/dsh-logo.svg") center / contain no-repeat;
    -webkit-mask: url("/dsh-logo.svg") center / contain no-repeat; }
  .startup-name { font-size: 22px; font-weight: 760; line-height: 1; letter-spacing: .02em; }
  .startup-status { color: var(--status); font-size: 13px; line-height: 1.5; text-align: center; min-height: 20px; }
  /* 条只由真分母驱动（唯一写入点 10-ui.js::installMeter）：没有分母时它是隐藏的。
     按代码顺序涨的假条比没有条更糟 —— 那正是当初整体删除进度条的理由。 */
  .dl-meter { display: none; width: 100%; max-width: 320px; height: 4px; margin: 8px auto 0; appearance: none; -webkit-appearance: none; border: none; background: var(--line); }
  .dl-meter::-webkit-progress-bar { background: var(--line); border-radius: 0; }
  .dl-meter::-webkit-progress-value { background: var(--brand); border-radius: 0; }
  .dl-meter::-moz-progress-bar { background: var(--brand); }
  .steps { display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 6px; color: var(--status); font-size: 12px;
    padding: 5px 9px; border-radius: 999px; transition: all .3s ease; }
  .step .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
  .step.active { color: var(--text); font-weight: 600; background: rgb(47 84 235 / 8%); }
  .step.active .dot { background: var(--brand); }
  .step.done { color: var(--ok); }
  .step.done .dot { background: var(--ok); }
  .step-arrow { color: var(--line); font-size: 12px; }
  .fail { display: grid; gap: 12px; justify-items: center; width: 100%;
    border: 1px solid color-mix(in srgb, var(--err) 30%, transparent); border-radius: 12px;
    padding: 16px; background: color-mix(in srgb, var(--err) 6%, transparent); }
  .fail-msg { color: var(--text); font-size: 12.5px; line-height: 1.6; text-align: center; word-break: break-word; }
  .fail-actions { display: flex; gap: 8px; }
  .fail-actions button { border: 1px solid var(--line); background: var(--brand); color: #fff;
    border-radius: 8px; padding: 7px 16px; font-size: 12.5px; cursor: pointer; }
  .fail-actions button.ghost { background: transparent; color: var(--status); }
  /* 镜像设置（仅失败态显示） */
  .mirror { display: grid; gap: 8px; width: 100%; border-top: 1px solid var(--line); padding-top: 12px; }
  .mirror-title { font-size: 12.5px; font-weight: 650; text-align: center; }
  .mirror-hint { font-size: 11.5px; color: var(--status); text-align: center; word-break: break-word; }
  .mirror-row { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; }
  .mirror-label { font-size: 11.5px; color: var(--status); }
  .mirror-row input { width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 11.5px; background: transparent; color: var(--text); }
  .mirror-actions { display: flex; gap: 8px; justify-content: center; }
  .mirror-actions button { border: 1px solid var(--line); background: var(--brand); color: #fff;
    border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .mirror-actions button.ghost { background: transparent; color: var(--status); }
  .choice { display: grid; gap: 10px; justify-items: center; width: 100%;
    border: 1px solid color-mix(in srgb, var(--brand) 32%, transparent); border-radius: 12px;
    padding: 16px; background: color-mix(in srgb, var(--brand) 6%, transparent); }
  .choice-title { font-size: 13.5px; font-weight: 680; color: var(--text); }
  .choice-msg { color: var(--text); font-size: 12.5px; line-height: 1.6; text-align: center; word-break: break-word; }
  .choice-meta { color: var(--status); font-size: 11.5px; line-height: 1.5; text-align: center; }
  .choice-actions { display: flex; gap: 8px; }
  .choice-actions button { border: 1px solid var(--line); background: var(--brand); color: #fff;
    border-radius: 8px; padding: 7px 16px; font-size: 12.5px; cursor: pointer; }
  .choice-actions button.ghost { background: transparent; color: var(--status); }
  /* 进度条整体移除 —— 所有下载/安装**一律只显示文字**。
     原进度条与真实进度常脱节（分段下载、解包阶段没有字节数可算），
     反而让用户把「进度没动」误读成「卡死」；现在四种 kind 共用 NS.install.* 的文字形态。 */
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 唯一窗口栏（壳提供：产品 WindowTitlebar 同款视觉）
     引导页是**主帧**（架构修复后窗口直接加载本页），
     故这里的 win_ctl 是主帧 IPC，必然可用（iframe 内的 IPC 会被 Tauri 拒绝）。*/
  #titlebar { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: #f9fafb; border-bottom: 1px solid rgb(0 0 0 / 5%);
    user-select: none; -webkit-user-select: none; }
  @media (prefers-color-scheme: dark) {
    #titlebar { background: #16191f; border-bottom: 1px solid rgb(255 255 255 / 12%); } }
  .tb-drag { -webkit-app-region: drag; app-region: drag; flex: 1; height: 100%; }
  .tb-btns { display: flex; height: 100%; }
  .tb-btns button { width: 44px; height: 100%; border: 0; background: transparent;
    color: #61666b; cursor: pointer; display: grid; place-items: center;
    transition: background .15s, color .15s; }
  .tb-btns button:hover { background: rgb(0 0 0 / 5%); color: #0f1115; }
  .tb-btns button.close:hover { background: #e81123; color: #fff; }
  /* 内容区下移，避免被固定标题栏遮住 */
  .page { padding-top: 40px; }
</style>
</head>
<body>
  <!-- 致命错误横幅（不变量 F2/F3）：全局 onerror / unhandledrejection 与启动自检显示它。
       默认隐藏；一旦显示即说明界面已无法继续，并给出可复制的具体原因。 -->
  <div id="fatal" style="display:none;position:fixed;left:0;right:0;top:0;z-index:9999;
       background:#7f1d1d;color:#fff;padding:10px 14px;font:13px/1.5 system-ui,sans-serif;
       border-bottom:2px solid #dc2626">
    <b>桌面壳遇到错误</b>：<span id="fatalText"></span>
  </div>
  <div id="titlebar">
    <div class="tb-drag" id="dragRegion" data-tauri-drag-region="deep"></div>
    <div class="tb-btns">
      <button id="btnMin" title="最小化" aria-label="最小化"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
      <button id="btnMax" title="最大化/还原" aria-label="最大化"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="0.5" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
      <button id="btnClose" class="close" title="关闭（隐藏到托盘）" aria-label="关闭"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
    </div>
  </div>

  <div class="page">
    <div class="inner">
      <div class="startup-logo" id="logo" aria-hidden="true"><span class="startup-logo-image"></span></div>
      <div class="startup-name">DSH-SUP</div>
      <div class="startup-status" id="status">正在检测环境…</div>
      <progress class="dl-meter" id="dlMeter" max="1" value="0"></progress>
      <!-- 阶段固定五步：检测环境 -> 桌面版本 -> 内核版本 -> 服务就绪 -> 进入面板。 -->
      <div class="steps" id="steps" style="display:none">
        <span class="step active" id="st-env"><span class="dot"></span>检测环境</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-shell"><span class="dot"></span>桌面版本</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-core"><span class="dot"></span>内核版本</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-guard"><span class="dot"></span>服务就绪</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-panel"><span class="dot"></span>进入面板</span>
      </div>
      <div class="fail" id="fail" style="display:none">
        <div class="fail-msg" id="failMsg"></div>
        <div class="fail-actions">
          <button id="btnRetry">重试</button>
          <!-- 环境探测失败时的**关键出口**：
               下载 Node 并不需要本机已有 Node —— 故「检测不出来」不应是死胡同。
               仅在环境超时后出现，避免普通用户误用。 -->
          <button id="btnForceNode" style="display:none">跳过检测，直接安装 Node</button>
          <button id="btnDiag" class="ghost">复制诊断</button>
          <button id="btnMirror" class="ghost">网络/镜像设置</button>
        </div>
        <!-- 镜像设置（**仅失败时出现**，避免干扰普通用户）：
             壳装机那一刻没有内核，面板里的「镜像源」卡不可用；
             若镜像不可达，用户将没有任何自助出口。此处只给最小可用的输入。 -->
        <div class="mirror" id="mirrorBox" style="display:none">
          <div class="mirror-title">镜像源（下载 Node / 内核时使用）</div>
          <div class="mirror-hint" id="mirrorHint">正在探测各镜像延迟…</div>
          <div class="mirror-row">
            <span class="mirror-label">Node</span>
            <input id="mirrorNode" placeholder="https://nodejs.org/dist" />
          </div>
          <div class="mirror-row">
            <span class="mirror-label">内核</span>
            <input id="mirrorNpm" placeholder="https://registry.npmmirror.com" />
          </div>
          <div class="mirror-actions">
            <button id="btnMirrorSave">保存并重试</button>
            <button id="btnMirrorProbe" class="ghost">重新探测</button>
          </div>
        </div>
      </div>
      <!-- 桌面版本更新失败页。只给【重试】：更新为强制，不得绕开。 -->
      <div class="choice" id="updChoice" style="display:none">
        <div class="choice-title">桌面版本更新未完成</div>
        <div class="choice-msg" id="updMsg"></div>
        <div class="choice-meta" id="updMeta"></div>
        <div class="choice-actions">
          <button id="btnUpdRetry">重试更新</button>
        </div>
      </div>
      </div>
    </div>
  </div>
<!-- 引导脚本按职责拆分为 9 个文件。
     原为 802 行单块脚本：一处语法错会导致**全页不执行**（已真实发生）。
     现每个文件独立语法检查（门禁 G5）；80-init 必须最后加载。 -->
  <script src="js/00-runtime.js"></script>
  <script src="js/10-ui.js"></script>
  <script src="js/20-env.js"></script>
  <script src="js/30-mirror.js"></script>
  <script src="js/40-shell-update.js"></script>
  <script src="js/50-kernel.js"></script>
  <script src="js/60-guard.js"></script>
  <script src="js/70-boot.js"></script>
  <script src="js/80-init.js"></script>
</body>
</html>
