[package]
name = "dsh-supervisor-gui"
version = "1.2.10"
description = "DSH lifecycle guard desktop shell (env bootstrap + panel)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# 桌面壳自更新（门 0）：Tauri 官方更新器 —— 强制 minisign 验签（不可关闭），
# 平台安装语义（Linux pkexec dpkg -i / macOS .app 替换 / Windows NSIS passive）由插件内部处理，
# 壳侧不写任何平台分支（跨平台行为一致性由此保证）。
tauri-plugin-updater = "2"
# app.restart()：更新安装后重启进入新版本（旧进程装、新进程跑）。
tauri-plugin-process = "2"
# tokio：为更新器提供**超时**能力（tauri 本身已依赖 tokio，故不新增下载）。
# 为什么必需：tauri-plugin-updater 的 Config（tauri.conf.json）**没有 timeout 字段**，
# 只能在 Builder 上设；而 reqwest 默认**无总超时** —— 网络不可达/丢包时 `check()`
# 既不返回也不报错，引导页会永久停在「正在检查桌面更新」。Windows 真机实测即卡死于此。
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
sha2 = "0.10"
hex = "0.4"
# 内核包的 `dist.integrity` 是 base64 形态的 sha512（registry 只给这个形态）。
# 与 dev-dependencies 里的同一个 crate：已在 Cargo.lock 内，不新增第三方来源。
base64 = "0.22"

[dev-dependencies]
# 发布产物验收（tests/updater_artifacts.rs）：
# 必须使用 **Tauri 自己用的同一个验签库**，否则测的不是真实链路。
minisign-verify = "0.2"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
