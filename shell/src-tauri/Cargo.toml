[package]
name = "lobox-shell"
version = "1.0.2"
description = "DSH lifecycle guard desktop shell (env bootstrap + panel)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# 桌面壳自更新（门 0）：Tauri 官方更新器 —— 强制 minisign 验签（不可关闭），平台安装语义由插件内部处理，壳侧不写任何平台分支。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tokio：为更新器提供**超时**能力（tauri 本身已依赖 tokio，故不新增下载）。为什么必需：tauri-plugin-updater 的 Config 里**没有 timeout 字段**，只能在 Builder 上设；而 reqwest 默认**无总超时** —— 网络不可达/丢包时 `check()` 既不返回也不报错，引导页会永久停在「正在检查桌面更新」（Windows 真机实测即卡死于此）。
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
minisign-verify = "0.2"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
