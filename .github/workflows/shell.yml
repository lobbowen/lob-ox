name: shell-build

on:
  push:
    tags: ['shell-*']
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/shell.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/shell.yml'
  workflow_dispatch:
    inputs:
      ver:
        description: '要复核的已发布版本（如 1.2.6；也可直接粘 tag：shell-1.2.6 或已发布版本号。留空 = 用当前仓库版本）'
        required: false
        default: ''
      from_run:
        description: '复用该 run id 已构建的产物直接发布（不重建）。填 main 分支上已全绿的 build run id；留空 = 走普通构建路径。'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: shell

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: tag 命名规范（仅 tag）
        if: github.ref_type == 'tag' && inputs.from_run == ''
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG_NAME:-}"
          [ -n "$TAG" ] || { echo "::error::tag 事件下 github.ref_name 为空"; exit 1; }
          case "$TAG" in
            shell-*) ;;
            *) echo "::error::tag 名 ${TAG} 不带 shell- 前缀（命名空间规范：shell-<壳版本>）"; exit 1 ;;
          esac
          echo "  ✓ 命名规范通过：${TAG}"

      - id: v
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # 只有「要产出新产物」时才构建矩阵。tag 路径同样不构建：
    # tag 是在 main 上验证通过之后才打的，那次 main run 的产物就是同一份源码编出来的，
    # 重新跑四平台只是把相同输入再编译一遍、字节相同却多耗一轮 runner 与一次发布延迟。
    # tag 由 release_from_run 指定它复用哪次已全绿的 main run（见 release_from_run job）。
    if: github.ref == 'refs/heads/main' && inputs.from_run == ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb
          - os: windows-latest
            artifact: win-x64
            bundles: nsis,msi
          - os: macos-latest
            artifact: darwin-arm64
            bundles: app,dmg
          - os: macos-15-intel
            artifact: darwin-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 包缓存：@tauri-apps/cli 的 tarball 命中缓存即免去一次 registry 往返。
      # 用 actions/cache 而非 setup-node 的 cache:，因为它需要 lock 文件做键，
      # 而 shell/ 下没有 package-lock.json（这里只装一个固定版本的 CLI）。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-tauri-cli-${{ runner.os }}-${{ hashFiles('shell/package.json') }}
          restore-keys: |
            npm-tauri-cli-${{ runner.os }}-

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
          key: ${{ matrix.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}

      - name: Install Linux system deps (Tauri v2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources 2>/dev/null || true
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libglib2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      # 只做 cargo check：把编译错误转成带 file:line 的 ::error 注解，便于在 PR 上定位。
      # 此前这里跑的是 cargo build --bins，而紧接着 tauri build 会自己再编一份二进制 ——
      # 同一份源码编译两遍是这个 job 的主要耗时来源，故改为 check（check 与 build 产物隔离，
      # 不会相互污染）。
      - name: 类型检查（cargo check，只为可读的报错）
        shell: bash
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/cargo-check.log"
          cargo check --bins 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            grep -E '^error(\[|:)|^ *-->' "$LOG" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$RC"
        working-directory: shell/src-tauri

      # 失败时把完整 cargo check 日志传上来。
      #
      # 为什么需要：annotations 只给前 40 行且 head -40 会截断，而「哪个文件哪一行」
      # 的完整清单是修编译错的唯一依据。本机没有 cargo（我们反复标注「Rust 编译待 CI 证」），
      # 所以 CI 日志是我们唯一的编译器输出 —— 把它当 artifact 上传，比任何静态排查都快。
      - name: 上传 cargo check 日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log-${{ matrix.artifact }}
          path: ${{ runner.temp }}/cargo-check.log
          if-no-files-found: warn
          retention-days: 7

      # 测试代码编译检查（只报告，不 gate）。
      #
      # 为什么必须单独一步：`cargo check --bins` **不编译 `#[cfg(test)]` 代码** ——
      # 那 27 个测试块是从未进过编译单元的代码，被测函数签名一改就静默腐烂，
      # 直到有人本机 cargo test 才炸，而开发机没有 cargo。
      #
      # 为什么是 continue-on-error 而非 gate：这一批腐烂是「从未编译过」的必然结果，
      # 不是新缺陷。第一次跑必然红，那个红的用途是拿回腐烂清单，不是拦发布。
      # 清单清完、这里连续两轮全绿之后，再改成 gate（去掉 continue-on-error）。
      #
      # ⚠ 「连续两轮全绿后改 gate」不是愿望，是**有账的动作**：notice 输出会提醒，
      #   但提醒不构成约束。真正的约束在 TEAM-LEDGER 的待办里记一条（本轮已记），
      #   改 gate 时同步销账。否则 continue-on-error 会变成永久的 —— 那又与
      #   「CI 绿 ≠ 问题解决」同族：一个永远不 gate 的检查步比没有它更危险，
      #   因为它制造「有检查」的假象（与 self-check 的过度声称同构）。
      #
      # 这不是 cargo test：只编译、不执行。用户否掉的是「cargo test 作为门禁步骤」，
      # 不是「编译检查」——执行断言仍需真机（与 STANDARDS 的 R1 一致）。
      - name: 测试代码腐烂检查（cargo check --tests，只报告不 gate）
        continue-on-error: true
        shell: bash
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/cargo-check-tests.log"
          cargo check --tests 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::warning::测试代码有腐烂项（不阻断发布）。错误数与清单："
            grep -cE '^error(\[|:)' "$LOG" || true
            grep -E '^error(\[|:)|^ *-->' "$LOG" | head -60 | while IFS= read -r l; do echo "::warning::$l"; done
          else
            echo "::notice::测试代码编译干净 —— 请把本步改成 gate（去掉 continue-on-error）并销 TEAM-LEDGER 的账"
          fi
        working-directory: shell/src-tauri

      # 腐烂清单同样要完整可读：continue-on-error 会让本步不红，但清单本身
      # 是「改 gate 之前要清完的账」——没有完整清单就不知道该清什么。
      # 注意 continue-on-error 的步 failure() 仍会触发，故 if: failure() 有效。
      - name: 上传 cargo check --tests 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-tests-log-${{ matrix.artifact }}
          path: ${{ runner.temp }}/cargo-check-tests.log
          if-no-files-found: warn
          retention-days: 7

      # Tauri CLI 预装一次并随 node 缓存留存：此前用 npx --yes @tauri-apps/cli@<ver>，
      # 每次 run 都要现拉一次包（--yes 也不会复用已装的那份）。
      # 配合下面的 npm tarball 缓存，命中时无需再访问 registry。
      - name: 预装 Tauri CLI
        shell: bash
        run: npm install --no-save --no-audit --no-fund "@tauri-apps/cli@2.11.5"

      - name: Build + bundle (Tauri)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CLI_VERSION: 2.11.5
        run: |
          UPDATER_OFF=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/shell-* ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置 —— tag 发布必须签名（Tauri updater 强制验签）"
              exit 1
            fi
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置 —— 不生成 .sig，产物不可用于自动更新（非 tag 构建不阻断）"
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "${RUNNER_TEMP}/updater-off.json"
            UPDATER_OFF="--config ${RUNNER_TEMP}/updater-off.json"
          fi
          ./node_modules/.bin/tauri build --bundles "${{ matrix.bundles }}" ${UPDATER_OFF}

      - name: 组装 npm 包（更新产物 + 签名）
        shell: bash
        run: |
          REQ_SIG="--require-sig"; [[ "${GITHUB_REF}" == refs/tags/shell-* ]] || REQ_SIG=""
          node shell-release/assemble-shell-pkg.js             --platform "${{ matrix.artifact }}"             --ver "${{ needs.version.outputs.ver }}"             --bundle-dir src-tauri/target/release/bundle             --out dist/npm-shell ${REQ_SIG}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            shell/src-tauri/target/release/bundle/deb/*.deb
            shell/src-tauri/target/release/bundle/dmg/*.dmg
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/src-tauri/target/release/bundle/msi/*.msi
            shell/src-tauri/target/release/bundle/**/*.sig
            shell/dist/npm-shell/**
          if-no-files-found: warn

      # Release 的创建与附件上传已移到 publish job：它下载 artifact 后手里就有全部
      # 安装包与 .sig。留在本 job 有两个问题 —— tag 路径下本 job 是 skipped，
      # 附件反而没人上传（自动更新因此拿不到产物）；且与 publish 会重复上传同一批文件。

  # 查出「tag 指向的提交」在 main 上已全绿的那次 shell-build run。
  # tag 路径下 build 是 skipped，publish 需要一个 run-id 才能跨 run 取到产物。
  resolve_build_run:
    if: startsWith(github.ref, 'refs/tags/shell-')
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      # 全局 defaults.run.working-directory: shell 使本 job 的 run 步骤工作目录为 shell/，
      # 故必须先 checkout，否则该目录不存在、bash 进程起不来（no such file or directory）。
      - uses: actions/checkout@v4

      - name: pick
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/$REPO/actions/runs?branch=main&per_page=100" --jq ".workflow_runs[] | select(.conclusion==\"success\" and .name==\"shell-build\" and .head_sha==\"$SHA\") | .id" | head -1)
          RID=${RID:-}
          if [ -z "$RID" ]; then
            echo "::error::tag 指向的提交在 main 上找不到已全绿的 shell-build run"
            echo "::error::请先确认 main 的 CI 已通过再打 tag；本次不发布"
            exit 1
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
  gate:
    needs: [version, build, resolve_build_run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # gate 用 run 步骤（受全局 working-directory: shell 约束），故必须先 checkout，
      # 否则工作目录不存在，bash 进程起不来（报 no such file or directory）。
      - uses: actions/checkout@v4

      - name: 断言所需构建已就绪
        shell: bash
        run: |
          set -euo pipefail
          # 产物来自哪次构建，三条路径优先级：显式 from_run > tag 时 resolve_build_run 查出的
          # 同一提交已全绿 run > 本 run 自己构建。
          RID="${{ inputs.from_run }}"
          if [ -z "$RID" ]; then RID="${{ needs.resolve_build_run.outputs.run_id }}"; fi
          if [ -n "$RID" ]; then
            echo "复用 run $RID 的产物，跳过构建 —— 通过"
            exit 0
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/shell-') && 'true' || 'false' }}" != "true" ]; then
            echo "非 tag 且未指定 from_run —— 本次不发布"
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::构建矩阵未成功（${{ needs.build.result }}），拒绝在未验证产物上发布"
            exit 1
          fi
          echo "构建矩阵已全绿 —— 通过"

  publish:
    needs: [version, gate, resolve_build_run]
    # 三条发布路径，全部以「产物来自哪次构建」为准：
    #   tag 推送        -> 复用 resolve_build_run 查出的、同一提交已全绿的 run（不重编译）；
    #   dispatch+from_run -> 复用显式指定的 run；
    #   两者都无（仅 main 的常规 CI）-> 不发布。
    # always() 是必需的：needs 链上 build 在 tag 路径下是 skipped，
    # 而 GitHub 会把「依赖里出现 skipped」连带传播 —— 不加它，publish 会被一起跳过，
    # tag run 显示 success 却什么都没发布（这正是首次验证时看到的现象）。
    # 后半段仍是发布条件本身，两者取与：既不被跳过，也不该发的时候不发。
    if: always() && (startsWith(github.ref, 'refs/tags/shell-') || inputs.from_run != '')
    outputs:
      ver: ${{ needs.version.outputs.ver }}
    runs-on: ubuntu-latest
    permissions:
      # 创建 Release / 上传附件需要写 contents；跨 run 下载 artifact 需要读 actions。
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 产物取自哪一次构建：from_run 指定时跨 run 取上一次已全绿的 build 产物（不重建）；
      # 未指定时取本次 run 自己的产物（tag 路径）。artifact 名即 matrix.artifact（平台名）。
      - name: 下载全部平台产物（本次 run）
        if: inputs.from_run == '' && needs.resolve_build_run.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          path: shell/dist/artifacts

      - name: 下载全部平台产物（复用 run ${{ inputs.from_run }}）
        if: inputs.from_run != '' || needs.resolve_build_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: shell/dist/artifacts
          run-id: ${{ inputs.from_run != '' && inputs.from_run || needs.resolve_build_run.outputs.run_id }}
          pattern: '*'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 归拢 npm 包目录
        shell: bash
        run: |
          mkdir -p dist/npm-shell
          for d in dist/artifacts/*/; do
            for cand in "$d/dist/npm-shell" "$d/npm-shell"; do
              [ -d "$cand" ] && cp -r "$cand/." dist/npm-shell/
            done
          done
          echo "=== 归拢后的包目录 ==="
          find dist/npm-shell -maxdepth 2 -type d | sort
          # 哨兵目录名取自 platform-map（6 平台映射单源），不写 @lob-ox/shell-<plat> 字面量
          SENTINEL="$(node -p "require('./shell-release/platform-map').npmPkgDir('linux-x64')")"
          if [ ! -d "dist/npm-shell/$SENTINEL" ]; then
            echo "::error::未归拢到 $SENTINEL，artifact 路径假设可能有误"
            echo "--- dist/artifacts 实际布局 ---"
            find dist/artifacts -maxdepth 4 -type d | head -40
            exit 1
          fi
      - name: 生成 shell-manifest.json（Tauri 静态清单）
        shell: bash
        run: |
          node shell-release/make-manifest.js \
            --ver "${{ needs.version.outputs.ver }}" \
            --entries dist/npm-shell \
            --out dist/npm-shell/shell-manifest.json

      - name: 发布平台子包 + 清单包到 npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          VER="${{ needs.version.outputs.ver }}"
          TAG=""
          RC_ALIAS=0
          case "$VER" in
            *-RC.*) TAG="--tag latest"; RC_ALIAS=1 ;;
            *-*)    TAG="--tag beta" ;;
            *)      TAG="--tag latest" ;;
          esac
          for d in dist/npm-shell/@lob-ox/shell-*; do
            [ -d "$d" ] || continue
            PKG_NAME=$(node -p "require('./$d/package.json').name")
            echo "== 发布 $PKG_NAME =="
            (cd "$d" && npm publish --access public $TAG)
            if [ "$RC_ALIAS" = "1" ]; then
              echo "== 补打 rc 别名：$PKG_NAME@$VER =="
              npm dist-tag add "$PKG_NAME@$VER" rc
            fi
          done
          REL=dist/npm-shell/@lob-ox/shell-release
          mkdir -p "$REL"
          cp dist/npm-shell/shell-manifest.json "$REL/"
          node -e "
          const fs=require('fs');
          fs.writeFileSync('$REL/package.json', JSON.stringify({
            name:'@lob-ox/shell-release', version:'$VER',
            description:'lobox desktop shell update manifest (Tauri updater static JSON).',
            license:'MIT', files:['shell-manifest.json']
          }, null, 2) + '\n');
          "
          (cd "$REL" && npm publish --access public $TAG)

      # 发布后自证：回查通道上真实可取的清单与产物，并逐字节比对本次构建产物。
      # 与 core.yml 的「发布后自证」同范式：真发布之后立刻自证，查不到即判红。
      # ⚠ --artifact-dir 传 assemble 的 --out 根（dist/npm-shell）；verify-channel 内的
      #   子目录名由 platform-map 推导，与 assemble 写出的 @lob-ox/shell-<plat> 同源。
      # ⚠ 默认平台名单 = linux-x64 / win-x64 / darwin-arm64 / darwin-x64，即本 workflow 构建矩阵的四腿。
      # 创建 GitHub Release 并上传安装包。
      #
      # 此前这一步挂在 build job 末尾（softprops/action-gh-release），而新路径下
      # build 是 skipped —— tag 发布只发了 npm，自动更新所需的 Release 附件反而没了。
      # 产物已随 artifact 下载到 dist/artifacts/，这里直接上传即可。
      - name: 创建 GitHub Release 并上传安装包
        if: startsWith(github.ref, 'refs/tags/shell-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          set -euo pipefail
          FILES=$(find dist/artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.sig' \) | sort)
          if [ -z "$FILES" ]; then
            echo "::error::未找到任何安装包或签名文件，拒绝创建空的 Release"
            find dist/artifacts -type f | head -20
            exit 1
          fi
          echo "待上传文件："
          echo "$FILES"
          # 必须「先建后传」：gh release create 不接受文件参数 ——
          # 它会对尚未存在的 Release 调上传接口，得到
          # HTTP 404 (uploads.github.com/.../releases/<id>/assets)。
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，补传附件"
          else
            gh release create "$TAG" --title "桌面壳 $VER" --generate-notes
          fi
          # 逐个上传而非一次性传全部：gh release upload 默认并发，
          # 大文件（dmg/exe 各 100MB 量级）并发时会撞上 Release 资源尚未就绪，
          # 得到 uploads.github.com 的 404（真机 1.0.34 即如此：前 3 个成功、第 4 个失败）。
          # 单文件串行 + 失败即报，不留下半份 Release。
          RC=0
          for f in $FILES; do
            if ! gh release upload "$TAG" "$f" --clobber; then
              echo "::error::上传失败：$f"
              RC=1
            fi
          done
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          echo "::notice::Release 就绪：$TAG（$(echo "$FILES" | wc -w | tr -d ' ') 个附件）"
      - name: 发布后自证（通道字节 = 本次构建产物）
        shell: bash
        run: |
          set -euo pipefail
          node shell-release/verify-channel.js \
            --ver "${{ needs.version.outputs.ver }}" \
            --artifact-dir dist/npm-shell \
            --conf src-tauri/tauri.conf.json \
            --tries 5 --settle 30000

      # 手动复核（workflow_dispatch）：只回查通道上的清单与签名块，不带字节比对
      # （本次 run 并未构建 ⇒ 本地无构建产物可比）。有限重试，轮次用尽即判红。
      - name: 通道复核（workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ inputs.ver }}"
          [ -n "$VER" ] || VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          VER="${VER#shell-}"
          node shell-release/verify-channel.js --ver "$VER" --conf src-tauri/tauri.conf.json --tries 5 --settle 30000
