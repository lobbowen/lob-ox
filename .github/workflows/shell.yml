name: shell-build

on:
  push:
    tags: ['shell-*']
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/shell.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/shell.yml'
  workflow_dispatch:
    inputs:
      ver:
        description: '要复核的已发布版本（如 1.2.6；也可直接粘 tag：shell-1.2.6 或已发布版本号。留空 = 用当前仓库版本）'
        required: false
        default: ''
      from_run:
        description: '复用该 run id 已构建的产物直接发布（不重建）。填 main 分支上已全绿的 build run id；留空 = 走普通构建路径。'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: shell

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: tag 命名规范（仅 tag）
        if: github.ref_type == 'tag' && inputs.from_run == ''
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG_NAME:-}"
          [ -n "$TAG" ] || { echo "::error::tag 事件下 github.ref_name 为空"; exit 1; }
          case "$TAG" in
            shell-*) ;;
            *) echo "::error::tag 名 ${TAG} 不带 shell- 前缀（命名空间规范：shell-<壳版本>）"; exit 1 ;;
          esac
          echo "  ✓ 命名规范通过：${TAG}"

      - id: v
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # 构建矩阵**只在 main 推送时**跑。
    # tag 推送不构建 —— tag 指向的就是 main 上刚验证过的那个提交，
    # 同一份源码再编一遍得到的字节完全相同，却要多耗一轮 runner 与数分钟延迟。
    # tag 路径的产物来自 main 那次 run，由 publish 经 run-id 跨 run 取回。
    #
    # 此前这里写的是 `inputs.from_run == ''`：tag 推送时该输入为空，条件成立，
    # 于是 tag 又把四平台编了一遍 —— 与 main 那次重复，产物字节完全相同。
    if: github.ref == 'refs/heads/main' && inputs.from_run == ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb
          - os: windows-latest
            artifact: win-x64
            bundles: nsis,msi
          - os: macos-latest
            artifact: darwin-arm64
            bundles: app,dmg
          - os: macos-15-intel
            artifact: darwin-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 包缓存：@tauri-apps/cli 的 tarball 命中缓存即免去一次 registry 往返。
      # 用 actions/cache 而非 setup-node 的 cache:，因为它需要 lock 文件做键，
      # 而 shell/ 下没有 package-lock.json（这里只装一个固定版本的 CLI）。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-tauri-cli-${{ runner.os }}-${{ hashFiles('shell/package.json') }}
          restore-keys: |
            npm-tauri-cli-${{ runner.os }}-

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
          key: ${{ matrix.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}

      - name: Install Linux system deps (Tauri v2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources 2>/dev/null || true
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libglib2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      # 只做 cargo check：把编译错误转成带 file:line 的 ::error 注解，便于在 PR 上定位。
      # 此前这里跑的是 cargo build --bins，而紧接着 tauri build 会自己再编一份二进制 ——
      # 同一份源码编译两遍是这个 job 的主要耗时来源，故改为 check（check 与 build 产物隔离，
      # 不会相互污染）。
      - name: 类型检查（cargo check，只为可读的报错）
        shell: bash
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/cargo-check.log"
          cargo check --bins 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            grep -E '^error(\[|:)|^ *-->' "$LOG" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$RC"
        working-directory: shell/src-tauri


      # Tauri CLI 预装一次并随 node 缓存留存：此前用 npx --yes @tauri-apps/cli@<ver>，
      # 每次 run 都要现拉一次包（--yes 也不会复用已装的那份）。
      # 配合下面的 npm tarball 缓存，命中时无需再访问 registry。
      - name: 预装 Tauri CLI
        shell: bash
        run: npm install --no-save --no-audit --no-fund "@tauri-apps/cli@2.11.5"

      - name: Build + bundle (Tauri)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CLI_VERSION: 2.11.5
        run: |
          UPDATER_OFF=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/shell-* ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置 —— tag 发布必须签名（Tauri updater 强制验签）"
              exit 1
            fi
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置 —— 不生成 .sig，产物不可用于自动更新（非 tag 构建不阻断）"
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "${RUNNER_TEMP}/updater-off.json"
            UPDATER_OFF="--config ${RUNNER_TEMP}/updater-off.json"
          fi
          ./node_modules/.bin/tauri build --bundles "${{ matrix.bundles }}" ${UPDATER_OFF}

      - name: 组装 npm 包（更新产物 + 签名）
        shell: bash
        run: |
          REQ_SIG="--require-sig"; [[ "${GITHUB_REF}" == refs/tags/shell-* ]] || REQ_SIG=""
          node shell-release/assemble-shell-pkg.js             --platform "${{ matrix.artifact }}"             --ver "${{ needs.version.outputs.ver }}"             --bundle-dir src-tauri/target/release/bundle             --out dist/npm-shell ${REQ_SIG}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            shell/src-tauri/target/release/bundle/deb/*.deb
            shell/src-tauri/target/release/bundle/dmg/*.dmg
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/src-tauri/target/release/bundle/msi/*.msi
            shell/src-tauri/target/release/bundle/**/*.sig
            shell/dist/npm-shell/**
          if-no-files-found: warn

      - name: Attach installers to GitHub Release（tag 触发时）
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/shell-')
        with:
          files: |
            shell/src-tauri/target/release/bundle/deb/*.deb
            shell/src-tauri/target/release/bundle/dmg/*.dmg
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/src-tauri/target/release/bundle/msi/*.msi
            shell/src-tauri/target/release/bundle/**/*.sig
          generate_release_notes: true

  # gate：tag 路径下确保 build 矩阵已跑完（from_run 路径下 build 被跳过，gate 直接通过）。
  # 用它而不是把 build 写进 publish.needs —— needs 里的 job 被 if 跳过会把下游一并 skip。
  # tag 发布取哪次构建的产物。
  #
  # tag 指向的提交，main 上必定已经跑过一次 shell-build（tag 只在验证通过后才打），
  # 那次 run 的产物就是这次要发布的东西 —— 同一份源码不必再编一遍。
  # 本 job 只做一件事：把那个 run id 找出来交给 publish。
  resolve_build_run:
    if: startsWith(github.ref, 'refs/tags/shell-')
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - name: 定位 tag 对应提交在 main 上的已全绿 run
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 取 main 上最近 100 次 run 的快照，再筛出「同一提交、已全绿、shell-build」的那次。
          # 筛选放在单行 python -c 里：多行会让块标量的缩进层级变得不可靠，
          # 而本机 js-yaml 与 GitHub 解析器在这点上的宽容度并不一致。
          gh api "repos/$REPO/actions/runs?branch=main&per_page=100" -H "Accept: application/vnd.github+json" > "$RUNNER_TEMP/runs.json"
          RID=$(python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/runs.json')); s=os.environ['SHA']; print(next((str(r['id']) for r in d.get('workflow_runs',[]) if r.get('conclusion')=='success' and r.get('name')=='shell-build' and r.get('head_sha')==s), ''))")
          if [ -z "$RID" ]; then
            echo "::error::tag 指向的提交在 main 上找不到已全绿的 shell-build run"
            echo "::error::请先让 main 的 CI 通过再打 tag；本次不发布（避免发布未经构建验证的产物）"
            exit 1
          fi
          echo "::notice::复用 main 上已全绿的 run $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
  gate:
    needs: [version, build, resolve_build_run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # gate 用 run 步骤（受全局 working-directory: shell 约束），故必须先 checkout，
      # 否则工作目录不存在，bash 进程起不来（报 no such file or directory）。
      - uses: actions/checkout@v4

      - name: 断言所需构建已就绪
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ inputs.from_run }}"; [ -n "$RID" ] || RID="${{ needs.resolve_build_run.outputs.run_id }}"
          if [ -n "$RID" ]; then
            echo "复用 run $RID 的产物，跳过构建 —— 通过"
            exit 0
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/shell-') && 'true' || 'false' }}" != "true" ]; then
            echo "非 tag 且未指定 from_run —— 本次不发布"
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::构建矩阵未成功（${{ needs.build.result }}），拒绝在未验证产物上发布"
            exit 1
          fi
          echo "构建矩阵已全绿 —— 通过"

  publish:
    needs: [version, gate, resolve_build_run]
    # 三条发布路径，全部以「产物来自哪次构建」为准：
    #   tag 推送        -> 本 run 构建并发布（唯一路径）；
    #   dispatch+from_run -> 复用显式指定的 run；
    #   两者都无（仅 main 的常规 CI）-> 不发布。
    if: startsWith(github.ref, 'refs/tags/shell-') || inputs.from_run != ''
    outputs:
      ver: ${{ needs.version.outputs.ver }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # from_run 跨 run 下载 artifact 需要读 Actions；tag 路径用不到但一并声明（最小权限仍是只读）。
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 产物取自哪一次构建：from_run 指定时跨 run 取上一次已全绿的 build 产物（不重建）；
      # 未指定时取本次 run 自己的产物（tag 路径）。artifact 名即 matrix.artifact（平台名）。
      - name: 下载全部平台产物（本次 run）
        if: resolve_build_run.outputs.run_id == '' && inputs.from_run == ''
        uses: actions/download-artifact@v4
        with:
          path: shell/dist/artifacts

      - name: 下载全部平台产物（复用 run ${{ inputs.from_run }}）
        if: resolve_build_run.outputs.run_id != '' || inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          path: shell/dist/artifacts
          run-id: ${{ inputs.from_run != '' && inputs.from_run || needs.resolve_build_run.outputs.run_id }}
          pattern: '*'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 归拢 npm 包目录
        shell: bash
        run: |
          mkdir -p dist/npm-shell
          for d in dist/artifacts/*/; do
            for cand in "$d/dist/npm-shell" "$d/npm-shell"; do
              [ -d "$cand" ] && cp -r "$cand/." dist/npm-shell/
            done
          done
          echo "=== 归拢后的包目录 ==="
          find dist/npm-shell -maxdepth 2 -type d | sort
          # 哨兵目录名取自 platform-map（6 平台映射单源），不写 @lob-ox/shell-<plat> 字面量
          SENTINEL="$(node -p "require('./shell-release/platform-map').npmPkgDir('linux-x64')")"
          if [ ! -d "dist/npm-shell/$SENTINEL" ]; then
            echo "::error::未归拢到 $SENTINEL，artifact 路径假设可能有误"
            echo "--- dist/artifacts 实际布局 ---"
            find dist/artifacts -maxdepth 4 -type d | head -40
            exit 1
          fi
      - name: 生成 shell-manifest.json（Tauri 静态清单）
        shell: bash
        run: |
          node shell-release/make-manifest.js \
            --ver "${{ needs.version.outputs.ver }}" \
            --entries dist/npm-shell \
            --out dist/npm-shell/shell-manifest.json

      - name: 发布平台子包 + 清单包到 npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          VER="${{ needs.version.outputs.ver }}"
          TAG=""
          RC_ALIAS=0
          case "$VER" in
            *-RC.*) TAG="--tag latest"; RC_ALIAS=1 ;;
            *-*)    TAG="--tag beta" ;;
            *)      TAG="--tag latest" ;;
          esac
          for d in dist/npm-shell/@lob-ox/shell-*; do
            [ -d "$d" ] || continue
            PKG_NAME=$(node -p "require('./$d/package.json').name")
            echo "== 发布 $PKG_NAME =="
            (cd "$d" && npm publish --access public $TAG)
            if [ "$RC_ALIAS" = "1" ]; then
              echo "== 补打 rc 别名：$PKG_NAME@$VER =="
              npm dist-tag add "$PKG_NAME@$VER" rc
            fi
          done
          REL=dist/npm-shell/@lob-ox/shell-release
          mkdir -p "$REL"
          cp dist/npm-shell/shell-manifest.json "$REL/"
          node -e "
          const fs=require('fs');
          fs.writeFileSync('$REL/package.json', JSON.stringify({
            name:'@lob-ox/shell-release', version:'$VER',
            description:'lobox desktop shell update manifest (Tauri updater static JSON).',
            license:'MIT', files:['shell-manifest.json']
          }, null, 2) + '\n');
          "
          (cd "$REL" && npm publish --access public $TAG)

      # 发布后自证：回查通道上真实可取的清单与产物，并逐字节比对本次构建产物。
      # 与 core.yml 的「发布后自证」同范式：真发布之后立刻自证，查不到即判红。
      # ⚠ --artifact-dir 传 assemble 的 --out 根（dist/npm-shell）；verify-channel 内的
      #   子目录名由 platform-map 推导，与 assemble 写出的 @lob-ox/shell-<plat> 同源。
      # ⚠ 默认平台名单 = linux-x64 / win-x64 / darwin-arm64 / darwin-x64，即本 workflow 构建矩阵的四腿。
      - name: 发布后自证（通道字节 = 本次构建产物）
        shell: bash
        run: |
          set -euo pipefail
          node shell-release/verify-channel.js \
            --ver "${{ needs.version.outputs.ver }}" \
            --artifact-dir dist/npm-shell \
            --conf src-tauri/tauri.conf.json \
            --tries 5 --settle 30000

      # 手动复核（workflow_dispatch）：只回查通道上的清单与签名块，不带字节比对
      # （本次 run 并未构建 ⇒ 本地无构建产物可比）。有限重试，轮次用尽即判红。
      - name: 通道复核（workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ inputs.ver }}"
          [ -n "$VER" ] || VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          VER="${VER#shell-}"
          node shell-release/verify-channel.js --ver "$VER" --conf src-tauri/tauri.conf.json --tries 5 --settle 30000
