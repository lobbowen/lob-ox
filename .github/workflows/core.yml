# trigger-1792370815036
# trigger-1792345114758
# 2026-10-18：本文件的注释改动只为触发两条工作流（为重打 tag 造一个 main 上双绿的 sha），
#   不影响任何构建/发布行为。详见 shell.yml 顶部同款注释。
name: core-build-release

# monorepo：core/ = 内核（本工作流），shell/ = 桌面壳（.github/workflows/shell.yml）。
# 两条产线的 tag 命名空间互不触发：内核 `core-<内核版本>`，壳 `shell-<壳版本>`。
#
# 发布职责边界（勿按 job 名推断，此处为登记单源）：
#   - npm 真发布只有一处：build 矩阵 job 的「内核发布（tag 触发 · NPM_TOKEN 唯一持有步）」，
#     它调 release/scripts/ci-core.sh --publish-only，由各矩阵腿各推自己平台的子包上 registry。
#   - release job 只负责把 build 各腿的 launcher 产物打包并挂到 GitHub Release 资产，它不含任何
#     npm publish ⇒「GitHub Release 上有资产」不等于「npm 上有包」，两者是两条独立路径。
on:
  push:
    tags:
      # ⚠ GitHub 的 path 过滤对 tag 推送不生效 ⇒ tag 命名空间必须按组件前缀分开。
      # 命名空间不带 `v`：`core-` 之后就是 `core/package.json#version` 的字面值，可逐字对账。
      - 'core-*'
    # 必须写本仓默认分支 main；写错分支名等于 push 回归永不触发。
    branches:
      - main
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'
  workflow_dispatch:
    inputs:
      ver:
        description: '发布后冒烟目标版本（须为**裸版本**，如 0.1.6-BETA.20；不要写 tag＝不要带 core-/v 前缀。留空则取 core/package.json#version）'
        required: false
        default: ''
      from_run:
        description: '复用该 run id 已构建的产物直接发布（不重建）。填 main 分支上已全绿的 build run id；留空 = 走普通构建路径。'
        required: false
        default: ''

# 顶层只给 contents: read ⇒ 新增 job 默认只读（fail-closed）；各 job 按需向上声明。
# 发布不幂等（npm 同版本不可重发 + Release 资产挂载竞态）⇒ tag 运行不得取消进行中的 run。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
# ⚠ group 里的 github.workflow = 本文件 name:。两条产线若同名，同 ref 的 group 会撞车并互相取消
#    ⇒ 本文件 name 必须与 shell.yml 区分。

# uses 钉 40 位 commit SHA（行尾注释是可读版本名）：@v4 之类是可变 tag，而本产线既读 secrets
#   又产出发布物 ⇒ 上游移动 tag 即等于供应链注入。

# 合仓后内核根 = core/：workflow 级把 run 步骤 cwd 统一钉到 core/（命令字面量一字不改）。
# ⚠ 只影响 `run:` 步骤。`uses:` 的输入路径（upload-artifact / download-artifact、action-gh-release
#   的 `files`）仍以 workspace 根为基准 ⇒ 必须显式加 `core/` 前缀（checkout 未用 `path:`）。
defaults:
  run:
    working-directory: core

jobs:
  precheck:
    # 复用既有 run 产物时不做「要不要构建」的决策：from_run 已经指明了产物来源。
    runs-on: ubuntu-latest
    outputs:
      need_build: ${{ steps.probe.outputs.need_build }}
      missing: ${{ steps.probe.outputs.missing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'


      - name: tag 命名规范（仅 tag）
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG_NAME:-}"
          [ -n "$TAG" ] || { echo "::error::tag 事件下 github.ref_name 为空"; exit 1; }
          case "$TAG" in
            core-*) ;;
            *) echo "::error::tag 名 ${TAG} 不带 core- 前缀（命名空间规范：core-<内核版本>）"; exit 1 ;;
          esac
          echo "  ✓ 命名规范通过：${TAG}"

      - name: 探测该版本是否已全部发布
        id: probe
        shell: bash
        run: |
          VER="$(node -p "require('./package.json').version")"
          echo "  版本: $VER"
          MISSING=""
          for p in $(node -e 'const p=require("./package.json");console.log((p.npmPublish&&p.npmPublish.packages||[]).join(" "))'); do
            if npm view "@lob-ox/$p@$VER" version >/dev/null 2>&1; then
              echo "    已发布 $p"
            else
              echo "    缺失   $p"
              MISSING="$MISSING $p"
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "  → 四平台已齐备：need_build=false（仅影响 release job 与 --publish 判定；precheck 设立初衷为省额度）"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
            echo "  → 需由 CI 补齐：$MISSING"
          fi

  build:
    # from_run 指定已全绿的 build run 时不再重建：同一份源码重编译一遍，产物字节相同却多耗一轮 runner。
    if: inputs.from_run == ''
    needs: precheck
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠ Linux 必须用 ubuntu-22.04（glibc 2.35）：24.04（glibc 2.39）的产物无法在
          #   22.04 / Debian 12 运行。
          - os: ubuntu-22.04
            artifact: linux-x64
            arch_override: ""
          - os: windows-latest
            artifact: win-x64
            arch_override: ""
          - os: macos-latest
            artifact: darwin-arm64
            arch_override: ""
            # darwin-x64 由 macos-14(arm64) + DSH_ARCH_OVERRIDE=x64 产出：launcher 架构无关。
          - os: macos-14
            artifact: darwin-x64
            arch_override: x64
    runs-on: ${{ matrix.os }}
    env:
      DSH_ARCH_OVERRIDE: ${{ matrix.arch_override }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 内核发布产线（verify + build:launcher + 子包 dry-run · 不带发布令牌）
        shell: bash
        run: bash release/scripts/ci-core.sh

      - name: 内核发布（tag 触发 · NPM_TOKEN 唯一持有步）
        if: startsWith(github.ref, 'refs/tags/core-') && needs.precheck.outputs.need_build == 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DSH_NPM_PROVENANCE: ${{ vars.DSH_NPM_PROVENANCE }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::tag 发布必须持有 NPM_TOKEN；缺它会导致 job 假绿且产物从未发布（tag=${GITHUB_REF_NAME}，need_build=true 即四平台确有缺失）"
            exit 1
          fi
          bash release/scripts/ci-core.sh --publish-only

      # 发布后自证：真发布之后立刻回查 registry。查不到即判红——「跳过」与「静默失败」不得再伪装成成功。
      # ⚠ 与发布步同门（tag + need_build=true）：非发布语境不进此步 ⇒ push/PR 上不会误红。
      - name: 发布后自证（回查 registry 确有该版本）
        if: startsWith(github.ref, 'refs/tags/core-') && needs.precheck.outputs.need_build == 'true'
        shell: bash
        run: |
          # ⚠ 本步带 -e：`VAR=$(cmd)` 非零会直接终止脚本、连 ::error:: 都打不出来 ⇒ 取值类赋值一律兜底。
          set -euo pipefail
          # registry 与 publish-core.sh 同一单源（脚本内同名默认值），不另起口径。
          REGISTRY="${DSH_PUBLISH_REGISTRY:-https://registry.npmjs.org/}"
          VER="$(node -p 'require("./package.json").version')" || {
            echo "::error::读取 core/package.json#version 失败（node -p 非零），发布后自证无法完成"; exit 1; }
          # 包名与上一轮子包构建同一口径（平台判定 + core/package.json#version），不新写字面量。
          PLAT="${DSH_PLATFORM_OVERRIDE:-$(node -p 'process.platform')}"
          ARCH="${DSH_ARCH_OVERRIDE:-$(node -p 'process.arch')}"
          case "$PLAT" in
            linux) OS_TAG=linux ;; darwin) OS_TAG=darwin ;; win32) OS_TAG=win ;;
            *) echo "::error::不支持的平台 $PLAT"; exit 1 ;;
          esac
          SPEC="@lob-ox/core-$OS_TAG-$ARCH@$VER"
          echo "  发布后自证目标: ${SPEC} registry=${REGISTRY}"

          # 一轮探测：$1=标签（日志用），$2=轮数，$3=轮间隔秒。
          # 返回值：0=已确认；1=预算用尽仍未确认。调用方只看返回值，不读全局变量。
          probe_budget() {
            local label="$1" attempts="$2" sleep_s="$3"
            local i=0 out
            while [ "$i" -lt "$attempts" ]; do
              i=$((i + 1))
              if out="$(npm view "$SPEC" version --registry="$REGISTRY" --prefer-online 2>&1)"; then
                out="${out//$'\r'/}"
                case "$out" in
                  *"$VER"*) echo "  [$label] registry 已确认 ${SPEC}（第 $i/$attempts 轮）"; return 0 ;;
                  *) echo "  [$label] 第 $i/$attempts 轮 npm view 返回与 $VER 不符: $out" ;;
                esac
              else
                echo "  [$label] 第 $i/$attempts 轮 registry 尚无该版本（等 registry 摄取与缓存过期）"
                printf '%s\n' "$out" | sed 's/^/    /'
              fi
              if [ "$i" -lt "$attempts" ]; then sleep "$sleep_s"; fi
            done
            return 1
          }

          # ⚠ 为什么这里要二次探测：这是「发布完成 → registry 可查」延迟的 race，已两次实证，
          #   且在不同平台 ⇒ 不是某平台慢，是延迟本身不可预测：
          #     0.0.22  linux-x64   自证放弃比实际发布晚 4 分 42 秒
          #     0.0.25  darwin-x64  自证放弃比实际发布晚 67 秒
          #   固定 5×75s 预算对三个平台够、对最慢那个不够。若只判红 ⇒ gate 红 ⇒ release job
          #   skipped ⇒ GitHub Release 资产缺一角（0.0.25 就丢了 4 个 kernel 包）。
          #
          # ⚠ 边界一（预算有上限）：二次预算与首次同型（5×75s），总预算 10×75s。**不无限重试**——
          #   一个永不失败的检查步比没有它更危险（§7.37：制造「有检查」的假象）。
          # ⚠ 边界二（保留判红能力）：notice 与 error 的区分是「探到了」vs「真的探不到」，
          #   不是「重试过了就放过」。防假绿的本意（publish 静默跳过被当成功）不丢。
          if probe_budget "首次探测" 5 75; then
            echo "  ✅ 发布后自证通过（首次预算内确认）"
            exit 0
          fi
          echo "  ⚠ 首次预算（5×75s）用尽仍未确认，进入独立二次预算重探——这不代表发布失败，是 registry 摄取延迟"
          if probe_budget "二次探测" 5 75; then
            echo "::notice::发布后自证在二次预算内确认 ${SPEC}——首次 5×75s 未赶上 registry 摄取延迟（已知 race：0.0.22 linux-x64 差 4m42s / 0.0.25 darwin-x64 差 67s）。发布本身成功，仅自证慢于延迟。"
            exit 0
          fi
          echo "::error::发布后自证失败：首次 5×75s + 二次 5×75s 共 10 轮后 registry 仍未确认 ${SPEC} - job 不得以此收场（产物并未真正发布，或 registry 摄取延迟超过 12.5 分钟——后者需人工核 registry 实况后再决定重打 tag）"
          exit 1

      # ⚠ upload-artifact 的 `path:` 相对 workspace 根，不受 defaults.run.working-directory 影响
      #    ⇒ 必须显式加 `core/` 前缀；artifact 内布局取匹配路径的最小公共祖先（= core/dist/launcher）。
      - name: Upload artifacts（内核 launcher 构建物）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            core/dist/launcher/**
            core/dist/launcher/README.md

  # 不能放进 build 矩阵：各腿会并发向同一 Release 上传（竞态），且 dist/launcher/** 含同名文件
  #    （如 core.cjs）会互相覆盖 ⇒ build 只上传 artifact，本 job 汇总后一次性挂载。
  # gate：tag 路径下确保构建矩阵已全绿（from_run 路径下 build 被跳过，gate 直接通过）。
  # 不用 needs 直接串 build —— needs 里的 job 被 if 跳过会把下游一并 skip。
  gate:
    needs: [precheck, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # gate 用 run 步骤（受全局 working-directory: core 约束），故必须先 checkout，
      # 否则工作目录不存在，bash 进程起不来（报 no such file or directory）。
      - uses: actions/checkout@v4

      - name: 断言所需构建已就绪
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.from_run }}" != "" ]; then
            echo "复用 run ${{ inputs.from_run }} 的产物，跳过构建 —— 通过"
            exit 0
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/core-') && 'true' || 'false' }}" != "true" ]; then
            echo "非 tag 且未指定 from_run —— 本次不发布"
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::构建矩阵未成功（${{ needs.build.result }}），拒绝在未验证产物上发布"
            exit 1
          fi
          echo "构建矩阵已全绿 —— 通过"

  release:
    needs: [precheck, gate]
    if: (startsWith(github.ref, 'refs/tags/core-') || inputs.from_run != '') && (inputs.from_run != '' || needs.precheck.outputs.need_build == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # from_run 跨 run 下载 artifact 需要读 Actions（tag 路径用不到，最小权限仍是只读）。
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 收集各平台构建产物（本次 run）
        if: inputs.from_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # ⚠ download-artifact 的 `path:` 同样是 workspace 根基准 ⇒ 显式落在 core/artifacts。
          path: core/artifacts

      - name: 收集各平台构建产物（复用 run ${{ inputs.from_run }}）
        if: inputs.from_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: core/artifacts
          run-id: ${{ inputs.from_run }}
          pattern: '*'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 本 run 块 cwd = core/ ⇒ 脚本里的 out/ 实际是 core/out/。
      - name: 按平台打包为唯一命名的 tar.gz
        shell: bash
        run: |
          VER="$(node -p "require('./package.json').version")"
          mkdir -p out
          echo "  版本: $VER"
          for d in artifacts/*/; do
            plat="$(basename "$d")"
            if [ -d "$d/dist/launcher" ]; then SRC="$d/dist/launcher"; else SRC="$d"; fi
            echo "  打包 $plat ← $SRC"
            tar -czf "out/lobox-kernel-$VER-$plat.tar.gz" -C "$SRC" .
          done
          echo "  产物:"
          ls -lh out/ | sed "s/^/    /"
          if [ -z "$(ls -A out 2>/dev/null)" ]; then echo "::error::未生成任何 Release 资产"; exit 1; fi

      # npm 真发布：正常路径在 build 矩阵内完成（各腿推自己平台的子包）。
      # from_run 模式下 build 被跳过（产物来自上一次已全绿的 run），npm 发布必须在这里补上，
      # 否则会出现「GitHub Release 有资产、npm 上没有包」的分裂状态。
      - name: npm 发布（复用 run 产物）
        if: inputs.from_run != ''
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bash release/scripts/ci-core.sh --publish-only

      # ⚠ `uses:` 的 `files` 是 workspace 根基准，而 tar.gz 落在 core/out/ ⇒ 写 core/out/*.tar.gz。
      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: core/out/*.tar.gz
          generate_release_notes: true
